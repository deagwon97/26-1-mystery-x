server {
    listen 8080;
    server_name _;
    client_max_body_size 10g;
    resolver 127.0.0.11 ipv6=off;

    location = /lua-health {
        default_type application/json;
        content_by_lua_file /etc/nginx/lua/health.lua;
    }

    location = /files/upload {
        rewrite_by_lua_file /etc/nginx/lua/on_request.lua;
        client_body_temp_path /app/data/uploads;
        content_by_lua_file /etc/nginx/lua/upload.lua;
        header_filter_by_lua_file /etc/nginx/lua/before_response.lua;
    }

    location ~ ^/files/([0-9a-fA-F-]+)/download$ {
        rewrite_by_lua_file /etc/nginx/lua/on_request.lua;
        content_by_lua_file /etc/nginx/lua/download.lua;
        header_filter_by_lua_file /etc/nginx/lua/before_response.lua;
    }

    location = /_meta/upload {
        internal;
        proxy_pass http://server-debug:8080/internal/files/upload-metadata;
        proxy_http_version 1.1;
        proxy_set_header Host server-debug;
        proxy_set_header Content-Type application/json;
    }

    location = /_spring_upload {
        internal;
        proxy_pass http://server-debug:8080/files/upload;
        proxy_http_version 1.1;
        proxy_set_header Host server-debug;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-File-Path $http_x_file_path;
        proxy_set_header X-File-Name $http_x_file_name;
        client_body_buffer_size 128m;
        client_max_body_size 10g;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /_legacy/upload {
        internal;
        proxy_pass http://server-debug:8080/files/upload;
        proxy_http_version 1.1;
        proxy_set_header Host server-debug;
    }

    location ~ ^/_meta/download/([0-9a-fA-F-]+)$ {
        internal;
        proxy_pass http://server-debug:8080/internal/files/$1/download-metadata;
        proxy_http_version 1.1;
        proxy_set_header Host server-debug;
    }

    location / {
        rewrite_by_lua_file /etc/nginx/lua/on_request.lua;

        proxy_pass http://server-debug:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        header_filter_by_lua_file /etc/nginx/lua/before_response.lua;
    }
}
