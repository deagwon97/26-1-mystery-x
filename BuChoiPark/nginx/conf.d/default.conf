server {
    listen 8080;
    server_name _;
    client_max_body_size 512m;
    resolver 127.0.0.11 ipv6=off;

    location = /lua-health {
        default_type application/json;
        content_by_lua_file /etc/nginx/lua/health.lua;
    }

    location = /files/upload {
        rewrite_by_lua_file /etc/nginx/lua/on_request.lua;
        content_by_lua_file /etc/nginx/lua/upload.lua;
        header_filter_by_lua_file /etc/nginx/lua/before_response.lua;
    }

    location ~ ^/files/([0-9a-fA-F-]+)/download$ {
        rewrite_by_lua_file /etc/nginx/lua/on_request.lua;
        content_by_lua_file /etc/nginx/lua/download.lua;
        header_filter_by_lua_file /etc/nginx/lua/before_response.lua;
    }

    location = /_meta/upload {
        internal;
        proxy_pass http://server-debug:8080/internal/files/upload-metadata;
        proxy_http_version 1.1;
        proxy_set_header Host server-debug;
        proxy_set_header Content-Type application/json;
    }

    location = /_legacy/upload {
        internal;
        proxy_pass http://server-debug:8080/files/upload;
        proxy_http_version 1.1;
        proxy_set_header Host server-debug;
    }

    location ~ ^/_meta/download/([0-9a-fA-F-]+)$ {
        internal;
        proxy_pass http://server-debug:8080/internal/files/$1/download-metadata;
        proxy_http_version 1.1;
        proxy_set_header Host server-debug;
    }

    location / {
        rewrite_by_lua_file /etc/nginx/lua/on_request.lua;

        proxy_pass http://server-debug:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        header_filter_by_lua_file /etc/nginx/lua/before_response.lua;
    }
}
