services:
  server-debug:
    build:
      context: ../
      dockerfile: ../deploy/Dockerfile
      target: builder
    container_name: buchoipark-server-debug
    environment:
      - SPRING_PROFILES_ACTIVE=debug
      - SQLITE_DB_PATH=/app/data/sqlite/livid.db
      - APP_STORAGE_DIR=/app/data/uploads
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=512MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=512MB
      - APP_UPLOAD_MAX_CONCURRENCY=8
      - APP_UPLOAD_MAX_INFLIGHT_BYTES=1073741824
      - APP_UPLOAD_MAX_QUEUE_BYTES=1073741824
      - APP_UPLOAD_MAX_QUEUE_REQUESTS=200
      - APP_UPLOAD_QUEUE_TIMEOUT_MS=20000
      - APP_DOWNLOAD_MAX_CONCURRENCY=24
      - APP_DOWNLOAD_MAX_QUEUE_BYTES=1073741824
      - APP_DOWNLOAD_MAX_QUEUE_REQUESTS=200
      - APP_DOWNLOAD_QUEUE_TIMEOUT_MS=20000
      - APP_DOWNLOAD_RATE_LIMIT_RPS=40
    volumes:
      - ../data/sqlite:/app/data/sqlite
      - ../data/uploads:/app/data/uploads
      - ../src:/app/src
      - ../e2e-test:/app/e2e-test
    stdin_open: true
    tty: true
    cpus: "2.0"
    mem_limit: 4g
    restart: unless-stopped

  nginx:
    image: openresty/openresty:1.27.1.2-0-alpine
    container_name: buchoipark-nginx
    expose:
      - "8080"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/lua:/etc/nginx/lua:ro
      - ../data/uploads:/app/data/uploads
    depends_on:
      - server-debug
    cpus: "2.0"
    mem_limit: 4g
    restart: unless-stopped

  loadtest:
    image: golang:1.24-bookworm
    container_name: buchoipark-loadtest
    working_dir: /work
    environment:
      - TARGET_BASE_URL=http://server-debug:8080
      - SQLITE_DB_PATH=/work/data/sqlite/livid.db
      - APP_STORAGE_DIR=/work/data/uploads
    volumes:
      - ../loadtest:/work/loadtest
      - ../data/sqlite:/work/data/sqlite
      - ../data/uploads:/work/data/uploads
      - ../e2e-test/upload-original:/work/testdata
    depends_on:
      - server-debug
    stdin_open: true
    tty: true
    command: "bash -c 'tail -f /dev/null'"
    cpus: "16.0"
    mem_limit: 32g
    restart: unless-stopped

